name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r player/requirements.txt

    - name: Prepare Compiled winsdk
      shell: pwsh
      run: |
        $pythonPath = (python -c "import site; print(site.getsitepackages()[0])")
        $actualWinsdkPath = Join-Path $pythonPath "winsdk"
        if (!(Test-Path "player/winsdk")) { New-Item -ItemType Directory -Path "player/winsdk" }
        Copy-Item -Path "$actualWinsdkPath/*" -Destination "player/winsdk" -Recurse -Force

    - name: Build Updater
      run: |
        cd player
        python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name Updater updater/main.py
        cp dist/Updater.exe .

    - name: Build Simple Audio Player
      shell: pwsh
      run: |
        $env:PYTHONPATH = "$((Get-Location).Path)\player;$((Get-Location).Path)"
        cd player
        python -m PyInstaller --noconfirm SimpleAudioPlayer.spec

    - name: Post-Build: Replace winsdk in dist
      shell: pwsh
      run: |
        Copy-Item -Path "player/winsdk" -Destination "player/dist/SimpleAudioPlayer/" -Recurse -Force

    - name: Build Installer (Inno Setup)
      run: |
        iscc player/simple_audio_player.iss

    - name: Prepare Release Assets
      shell: pwsh
      run: |
        # Use simpler file names for assets
        Move-Item -Path "player/dist/SimpleAudioPlayerSetup.exe" -Destination "player/dist/SimpleAudioPlayer-Setup.exe"
        Compress-Archive -Path "player/dist/SimpleAudioPlayer/*" -DestinationPath "player/dist/SimpleAudioPlayer-Portable.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          player/dist/SimpleAudioPlayer-Setup.exe
          player/dist/SimpleAudioPlayer-Portable.zip
        draft: false
        prerelease: false
