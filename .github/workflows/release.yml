name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r player/requirements.txt

    - name: Get info from info.json
      id: get_info
      shell: bash
      run: |
        VERSION=$(node -p "require('./info.json').version")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build Updater
      shell: pwsh
      run: |
        cd player
        python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx --name Updater updater/main.py
        Copy-Item -Path "dist/Updater.exe" -Destination "." -Force

    - name: Build Simple Audio Player
      shell: pwsh
      run: |
        $env:PYTHONPATH = "$((Get-Location).Path)\player;$((Get-Location).Path)"
        cd player
        python -m PyInstaller --noconfirm SimpleAudioPlayer.spec

    - name: Build Installer (Inno Setup)
      run: |
        iscc player/simple_audio_player.iss

    - name: Prepare Release Assets
      shell: pwsh
      run: |
        $VERSION = "${{ steps.get_info.outputs.version }}"
        Move-Item -Path "player/dist/SimpleAudioPlayerSetup.exe" -Destination "player/dist/SimpleAudioPlayer-v$VERSION.exe"
        Compress-Archive -Path "player/dist/SimpleAudioPlayer/*" -DestinationPath "player/dist/SimpleAudioPlayer-v$VERSION.zip"
        Write-Host "Assets prepared: SimpleAudioPlayer-v$VERSION.exe and SimpleAudioPlayer-v$VERSION.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          player/dist/SimpleAudioPlayer-v${{ steps.get_info.outputs.version }}.exe
          player/dist/SimpleAudioPlayer-v${{ steps.get_info.outputs.version }}.zip
        name: Update v${{ steps.get_info.outputs.version }}
        body: "Release v${{ steps.get_info.outputs.version }}"
        draft: false
        prerelease: false
